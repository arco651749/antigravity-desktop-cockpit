<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#4338ca" stroke-width="1.5"/>

  <!-- Screen Frame -->
  <rect x="8" y="10" width="48" height="34" rx="5" fill="#181824" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="11" y="13" width="42" height="28" rx="3" fill="#090a10"/>

  <!-- Window Header dots -->
  <circle cx="16" cy="18" r="1.5" fill="#ef4444"/>
  <circle cx="21" cy="18" r="1.5" fill="#f59e0b"/>
  <circle cx="26" cy="18" r="1.5" fill="#10b981"/>

  <!-- Monitor Stand Base -->
  <path d="M26 44 L38 44 L40 50 L24 50 Z" fill="#475569"/>
  <rect x="20" y="50" width="24" height="3" rx="1.5" fill="#64748b"/>

  <!-- Grid lines in Screen -->
  <path d="M11 28 L53 28 M32 13 L32 41" stroke="#1e293b" stroke-width="1"/>

  <!-- AI Pulse Target Circle (Red Glow) -->
  <circle cx="38" cy="27" r="5" fill="none" stroke="#ef4444" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="38" cy="27" r="1.5" fill="#ef4444"/>

  <!-- Human Cursor Arrow (Green/White) -->
  <path d="M23 23 L23 35 L27 31 L31 37 L33 36 L29 30 L34 30 Z" fill="#4ade80" stroke="#0f172a" stroke-width="1"/>
</svg>
