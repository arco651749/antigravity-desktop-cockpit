<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desktop Cockpit 3.0</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/preload.js"></script>
</head>
<body>
  <div class="cockpit-app">
    <!-- ==================== TRACK 1: PRIMARY COMMAND BAR ==================== -->
    <div class="deck-row deck-row-primary">
      <!-- Left: Brand Badge + Window Selector + Virtual Screen Segmented Controls -->
      <div class="deck-group">
        <span class="cockpit-badge" title="Antigravity Desktop Cockpit 3.0 — 雙游標零干擾駕駛艙">COCKPIT 3.0</span>
        <div class="window-picker-box">
          <span class="picker-icon">🖥️</span>
          <select id="windowSelect" title="選擇欲監控或派駐的目標桌面視窗">
            <option value="">載入視窗中...</option>
          </select>
          <button id="btnRefresh" class="icon-btn" title="重新列舉活動視窗">↻</button>
        </div>

        <div class="deck-divider"></div>

        <!-- Screen Topology & Dispatch Controls -->
        <div id="virtualMonStatus" class="status-pill status-idle" title="點擊切換虛擬第二螢幕硬體狀態 (0 批次檔、0 UAC)">
          <span class="dot"></span>
          <span id="virtualMonText">虛擬螢幕: 檢測中</span>
        </div>
        <div class="segmented-group">
          <button id="btnDispatchVirtual" class="seg-btn seg-btn-primary" title="將目標視窗派駐至虛擬第二螢幕，徹底隔離不擋主畫面">🚀 派駐虛擬艙</button>
          <button id="btnRestorePrimary" class="seg-btn" title="將目標視窗移回主實體螢幕">🏠 移回主畫面</button>
          <button id="btnToggleDisplay" class="seg-btn" title="程式化插拔虛擬顯示器硬體 (Win32 IOCTL)">🔌</button>
        </div>
      </div>

      <!-- Right: Mode, FPS, Engine Restart & Annotation Trigger -->
      <div class="deck-group">
        <select id="modeSelect" class="compact-select" title="切換直通原子借還模式或純背景模式">
          <option value="direct" selected>⚡ 直通 + 焦點自動歸還</option>
          <option value="background">🌿 純背景 (PostMessage)</option>
        </select>

        <select id="fpsSelect" class="compact-select" title="動態串流目標幀率">
          <option value="60">60 FPS</option>
          <option value="30" selected>30 FPS</option>
          <option value="15">15 FPS</option>
          <option value="5">5 FPS</option>
        </select>

        <button id="btnEngineRestart" class="icon-btn" title="重啟底層 Rust 串流引擎">⚡</button>
        <button id="btnAnnotateToggle" class="btn-annotate" title="定格畫面並開啟畫筆標註 (快捷鍵: Ctrl+Shift+A)">📸 截圖標註</button>
      </div>
    </div>

    <!-- ==================== TRACK 2: DUAL-CURSOR & TELEMETRY DECK ==================== -->
    <div class="deck-row deck-row-telemetry">
      <!-- Left: Focus Guard Status + User Cursor Stat -->
      <div class="deck-group">
        <div id="arbiterStatus" class="status-pill status-guard" title="操作完畢後自動將實體滑鼠與鍵盤焦點歸還主畫面">
          <span class="dot"></span>
          <span id="arbiterText">🛡️ 主畫面焦點保護中</span>
        </div>

        <div class="hud-stat" id="hudStat" title="串流即時幀率與畫布歸一化座標">
          FPS: 30 | 游標: (0.000, 0.000)
        </div>
      </div>

      <!-- Right: Semantic UIA & Visual Diff -->
      <div class="deck-group">
        <button id="btnScanUIA" class="deck-action-btn btn-uia" title="掃描當前目標視窗之 Windows UIA 語意樹">🌳 UIA 樹</button>
        <button id="btnDiff" class="deck-action-btn" title="比對 Visual Memory 快照 (偵測新彈窗與對話框)">📊 差異偵測</button>
      </div>
    </div>

    <!-- ==================== STREAMING CANVAS VIEWPORT ==================== -->
    <div class="viewport-wrapper" id="viewport" tabindex="0">
      <div class="canvas-stage" id="canvasStage">
        <canvas id="streamCanvas"></canvas>
        <canvas id="annotationCanvas" class="annotation-canvas" hidden></canvas>

        <!-- 🎯 Precision Virtual Dot Pointer (Centered dot, zero text clutter) -->
        <div id="aiVirtualCursor" class="ai-virtual-cursor" style="left: 50%; top: 50%;">
          <div id="aiCursorRippleHost" class="ai-cursor-ripple-host"></div>
          <div class="ai-cursor-dot"></div>
        </div>
      </div>
    </div>

    <!-- ==================== COMPACT 2-LINE EVENT CONSOLE ==================== -->
    <div class="console-pane" id="consoleLogs">
      <div class="log-entry">
        <span class="log-time">[系統]</span>
        <span class="log-sys">Antigravity Desktop Cockpit 3.0 雙軌指揮台已就緒 (虛擬 AI 游標 + 主畫面焦點自動歸還已啟用)</span>
      </div>
    </div>

    <!-- ==================== BOTTOM DOCKED ANNOTATION TOOLBAR ==================== -->
    <div id="annotToolbar" class="cockpit-annot-dock" hidden>
      <div class="annot-tool-group">
        <button class="annot-btn active" data-tool="pen" title="畫筆 (Freehand)">✏️ 畫筆</button>
        <button class="annot-btn" data-tool="rect" title="框選 (Box)">🔲 框選</button>
        <button class="annot-btn" data-tool="arrow" title="箭頭 (Arrow)">➡️ 箭頭</button>
      </div>
      <div class="annot-divider"></div>
      <div class="annot-color-group">
        <span class="color-dot active" data-color="#ef4444" style="background:#ef4444;" title="紅色"></span>
        <span class="color-dot" data-color="#eab308" style="background:#eab308;" title="黃色"></span>
        <span class="color-dot" data-color="#22c55e" style="background:#22c55e;" title="綠色"></span>
        <span class="color-dot" data-color="#3b82f6" style="background:#3b82f6;" title="藍色"></span>
        <span class="color-dot" data-color="#ffffff" style="background:#ffffff;" title="白色"></span>
      </div>
      <div class="annot-divider"></div>
      <div class="annot-size-group">
        <button class="size-btn" data-size="2">細</button>
        <button class="size-btn active" data-size="4">中</button>
        <button class="size-btn" data-size="8">粗</button>
      </div>
      <div class="annot-divider"></div>
      <div class="annot-action-group">
        <button class="annot-action-btn" id="btnAnnotUndo" title="復原上一筆 (Ctrl+Z)">↩️ 復原</button>
        <button class="annot-action-btn" id="btnAnnotClear" title="清空所有標註">🗑️ 清空</button>
        <button class="annot-action-btn" id="btnAnnotCopy" title="複製標註圖片到剪貼簿，可在對話輸入框按 Ctrl+V 貼上">📋 Ctrl + C, V</button>
        <button class="annot-action-btn btn-primary" id="btnAnnotSend" title="提問 Agent (包含標註圖片)">💬 Ask</button>
        <button class="annot-action-btn btn-danger" id="btnAnnotClose" title="離開標註模式並恢復即時串流 (Esc)">✕ 關閉</button>
      </div>
    </div>
  </div>

  <!-- Ask Agent Popover Modal -->
  <div id="annotSendPopover" class="annot-send-popover" hidden>
    <div class="popover-content">
      <div class="popover-header">
        <span id="popoverTitle">💬 提問 Agent (標註圖片)</span>
        <button id="popoverClose" class="popover-close-btn">&times;</button>
      </div>
      <textarea id="popoverInput" rows="3" placeholder="請輸入想對 AI Agent 說的話（按 Enter 直接發送，Shift+Enter 換行）..."></textarea>
      <div class="popover-actions">
        <button id="popoverCancelBtn" class="btn btn-secondary">取消</button>
        <button id="popoverSubmitBtn" class="btn btn-primary">送出 (Enter)</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
