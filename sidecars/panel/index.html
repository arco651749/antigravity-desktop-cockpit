<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desktop Cockpit</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/preload.js"></script>
</head>
<body>
  <div class="cockpit-app">
    <!-- Top HUD Toolbar -->
    <div class="toolbar">
      <div class="tool-group">
        <span style="font-weight: 700; color: #fff;">🖥️ 視窗:</span>
        <select id="windowSelect">
          <option value="">載入視窗中...</option>
        </select>
        <button id="btnRefresh" title="重新列舉視窗">🔄 刷新</button>
      </div>

      <div class="tool-group">
        <div id="virtualMonStatus" class="status-pill status-idle" style="font-size: 11px;" title="虛擬顯示器驅動硬體狀態">
          <span class="dot"></span>
          <span id="virtualMonText">虛擬螢幕: 檢測中</span>
        </div>
        <button id="btnToggleDisplay" class="btn-secondary" title="程式化開關虛擬螢幕硬體 (免 UAC / 免批次檔)">🔌 開關螢幕</button>
        <button id="btnDispatchVirtual" class="btn-primary" title="將當前視窗派駐至虛擬第二螢幕，徹底隔離防止覆蓋 Antigravity IDE">🚀 派駐虛擬螢幕</button>
        <button id="btnRestorePrimary" class="btn-secondary" title="將視窗移回主實體螢幕">⬅️ 移回主螢幕</button>
      </div>

      <div class="tool-group" style="background: rgba(37, 99, 235, 0.15); border: 1px solid rgba(59, 130, 246, 0.4); border-radius: 6px; padding: 4px 8px;">
        <span style="font-weight: 700; color: #60a5fa;">🧠 語意感知:</span>
        <button id="btnScanUIA" class="btn-primary" title="掃描當前目標視窗之 UIA 語意樹與控制項">🌳 UIA 樹</button>
        <button id="btnDiff" class="btn-secondary" title="比對 Visual Memory 快照 (偵測新彈窗與狀態差異)">📊 差異偵測</button>
      </div>

      <div class="tool-group">
        <span style="color: #60a5fa; font-weight: 600; font-size: 11px;">模式:</span>
        <select id="modeSelect" title="切換直通模式或背景模式">
          <option value="direct" selected>⚡ 直通模式 (DXGI / SendInput)</option>
          <option value="background">🌿 背景模式 (PrintWindow)</option>
        </select>
      </div>

      <div class="tool-group">
        <span style="color: var(--text-muted); font-size: 11px;">幀率:</span>
        <select id="fpsSelect">
          <option value="60">⚡ 60 FPS</option>
          <option value="30" selected>🌿 30 FPS</option>
          <option value="15">🍃 15 FPS</option>
          <option value="5">💤 5 FPS</option>
        </select>
        <button id="btnEngineRestart" title="重啟底層串流引擎">⚡ 重啟</button>
      </div>
    </div>

    <!-- Arbiter Status Banner -->
    <div class="arbiter-banner">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span>控制權:</span>
        <div id="arbiterStatus" class="status-pill status-idle">
          <span class="dot"></span>
          <span id="arbiterText">待機 (隨時接受人類或 AI 操作)</span>
        </div>
      </div>
      <div style="color: var(--text-muted);">
        提示: 畫布內直接支援左/中/右鍵拖曳 (Blender 旋轉)、滾輪與按鍵穿透
      </div>
    </div>

    <!-- Streaming Canvas Viewport -->
    <div class="viewport-wrapper" id="viewport" tabindex="0">
      <canvas id="streamCanvas"></canvas>
      <div class="hud-stat" id="hudStat">
        FPS: -- | 延遲: -- ms | 座標: (0.000, 0.000)
      </div>
      <div class="focus-badge" id="focusBadge">
        🔘 點擊畫布捕捉鍵盤輸入 (按 Esc 釋放焦點回到聊天室)
      </div>
    </div>

    <!-- Live Event Console -->
    <div class="console-pane" id="consoleLogs">
      <div class="log-entry">
        <span class="log-time">[系統]</span>
        <span class="log-sys">Antigravity Desktop Cockpit 駕駛艙初始化中...</span>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
